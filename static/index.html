<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.tag{padding:1px 8px;border-radius:10px;font-size:12px}.reserved{background:#fff4d6;color:#8a6100}.switched{background:#e2f5e8;color:#1c6b35}.failed{background:#fde3e1;color:#9a2a20}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入（含接替交接 <code>/api/relief/reserve|confirm|fail</code>）通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>原船</th><th>接替船</th><th>切换时刻</th><th>当前责任人</th><th>交接</th><th>失败原因</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
const ASSET_STATUS={available:'可用',assigned:'执行中',reserved:'接替预留'};
const HANDOVER_STATUS={reserved:'预留中',switched:'已切换',failed:'接替失败'};
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  const names=Object.fromEntries(d.assets.map(a=>[a.id,a.name]));
  const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')};
  fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);
  document.querySelector('#assets tbody').innerHTML=d.assets.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.kind)}</td><td>${esc(ASSET_STATUS[a.status]||a.status)}</td><td>${esc(a.range_km)}</td></tr>`).join('');
  document.querySelector('#areas tbody').innerHTML=d.search_areas.map(r=>{
    const tag=r.handover_status?`<span class="tag ${r.handover_status}">${HANDOVER_STATUS[r.handover_status]||r.handover_status}</span>`:'';
    return `<tr><td>${esc(r.code)}</td><td>${esc(r.incident_id)}</td><td>${esc(r.status)}</td><td>${esc(r.priority)}</td>`
      +`<td>${esc(r.original_asset_name??names[r.original_asset_id])}</td>`
      +`<td>${esc(r.relief_asset_name??(r.relief_asset_id?names[r.relief_asset_id]:''))}</td>`
      +`<td>${esc(r.switched_at)}</td><td><b>${esc(names[r.current_asset_id])}</b></td><td>${tag}</td><td>${esc(r.handover_failure_reason)}</td></tr>`;
  }).join('');
  document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${esc(x.created_at)} ${esc(x.actor)} ${esc(x.action)} ${esc(x.details)}</li>`).join('');
}
load();
</script></html>
